{% extends "base.html" %}
{% block content %}
    <div class="container mt-4 config_form">
        <div class="card shadow-sm">
            <div class="card-body">
                <h4 class="card-title mb-4">Configurações</h4>
                <form method="post">
                    {% for key, value in config.items() %}
                        <div class="mb-3">
                            <label for="{{ key }}" class="form-label text-capitalize">{{ key.replace('_', ' ') }}</label>
                            <input type="number"
                                   class="form-control"
                                   id="{{ key }}"
                                   name="{{ key }}"
                                   value="{{ value }}">
                        </div>
                    {% endfor %}
                    <div class="d-flex justify-content-end">
                        <button type="submit" class="btn btn-primary">Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock content %}
